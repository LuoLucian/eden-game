<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊甸园 — 大屏展示</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    color: #fff;
    font-family: 'Noto Serif SC', serif;
    height: 100vh;
    overflow: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(34,197,94,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(251,191,36,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(239,68,68,0.06) 0%, transparent 50%);
  }

  /* 粒子背景 */
  #particles { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  .container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; padding: 14px 32px; }

  /* 顶部标题区 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .title-area { display: flex; align-items: center; gap: 18px; }
  .game-title {
    font-size: 40px;
    font-weight: 900;
    background: linear-gradient(135deg, #f6d365 0%, #fda085 50%, #a8edea 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color:transparent;
    letter-spacing: 5px;
  }
  .game-subtitle { font-size: 13px; color: rgba(255,255,255,0.35); letter-spacing: 3px; }

  .round-badge {
    background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(251,191,36,0.05));
    border: 1.5px solid rgba(251,191,36,0.4);
    border-radius: 12px;
    padding: 7px 20px;
    font-size: 19px;
    color: #fbbf24;
    font-weight: 700;
  }

  .final-round-badge {
    background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(168,85,247,0.08));
    border: 1px solid rgba(168,85,247,0.6);
    border-radius: 12px;
    padding: 6px 18px;
    font-size: 17px;
    color: #c084fc;
    font-weight: 700;
    display: none;
    animation: glowPurple 2s infinite alternate;
  }
  @keyframes glowPurple {
    from { box-shadow: 0 0 6px rgba(168,85,247,0.3); }
    to { box-shadow: 0 0 18px rgba(168,85,247,0.6); }
  }

  /* 轮次进度点 */
  .round-dots { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .round-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    transition: all 0.3s;
  }
  .round-dot.done { background: #4ade80; border-color: #4ade80; }
  .round-dot.current { background: #fbbf24; border-color: #fbbf24; transform: scale(1.3); }
  .round-dot.final { background: rgba(168,85,247,0.5); border-color: #c084fc; }

  .player-count { font-size: 15px; color: rgba(255,255,255,0.45); text-align: right; }
  .player-count span { color: #4ade80; font-size: 26px; font-weight: 700; }
  .active-count { color: #fbbf24; font-size: 19px; font-weight: 600; margin-top: 2px; }
  .eliminated-count { color: #f87171; font-size: 13px; margin-top: 1px; }

  /* 主内容区：排行榜占主体 */
  .main-content { flex: 1; display: flex; flex-direction: column; padding-top: 14px; overflow: hidden; }

  .lb-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .lb-title { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: rgba(255,255,255,0.7); }
  .lb-title span { color: #fbbf24; }

  /* 排行榜双列网格 */
  .lb-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    overflow: hidden;
    align-content: start;
  }

  .lb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 15px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 11px;
    transition: all 0.3s ease;
    font-size: 17px;
  }
  .lb-item.top1 { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.35); }
  .lb-item.top2 { background: rgba(148,163,184,0.08); border-color: rgba(148,163,184,0.25); }
  .lb-item.top3 { background: rgba(234,179,8,0.07); border-color: rgba(234,179,8,0.2); }

  .lb-rank { font-size: 19px; font-weight: 900; width: 32px; text-align: center; color: rgba(255,255,255,0.25); flex-shrink: 0; }
  .lb-item.top1 .lb-rank { color: #fbbf24; font-size: 23px; }
  .lb-item.top2 .lb-rank { color: #94a3b8; font-size: 21px; }
  .lb-item.top3 .lb-rank { color: #d97706; font-size: 20px; }

  .lb-num { font-size: 14px; color: #fbbf24; font-weight: 700; opacity: 0.6; min-width: 30px; }
  .lb-name { flex: 1; font-size: 17px; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-score { font-size: 19px; font-weight: 800; color: #4ade80; flex-shrink: 0; }
  .lb-item.eliminated { opacity: 0.35; text-decoration: line-through; border-color: rgba(248,113,113,0.15); }
  .lb-item.eliminated .lb-score { color: #f87171; }

  /* 投票进度条（底部） */
  .vote-status-bar {
    display: none;
    align-items: center;
    gap: 18px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 13px;
    margin-top: 10px;
  }
  .vsb-label { font-size: 15px; color: rgba(255,255,255,0.38); white-space: nowrap; }
  .vsb-progress { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .vsb-fill { height: 100%; background: linear-gradient(90deg,#4ade80,#22c55e); border-radius: 4px; transition: width 0.5s; min-width: 4px; }
  .vsb-count { font-size: 17px; font-weight: 700; color: #4ade80; }

  /* 等待界面 */
  .waiting-section { display: flex; align-items: center; justify-content: center; gap: 60px; flex: 1; }
  .qr-area { text-align: center; }
  .qr-img { width: 220px; height: 220px; border-radius: 16px; background: #fff; padding: 8px; }
  .qr-label { margin-top: 14px; font-size: 17px; color: rgba(255,255,255,0.35); letter-spacing: 2px; }
  .qr-url { margin-top: 8px; font-size: 19px; color: #4ade80; font-weight: 700; }
  .waiting-info { text-align: center; }
  .waiting-big { font-size: 90px; font-weight: 900; color: #fbbf24; }
  .waiting-label { font-size: 22px; color: rgba(255,255,255,0.35); margin-top: 10px; letter-spacing: 3px; }

  /* ===== 内嵌结算区（排行榜下方） ===== */
  .result-inline {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 16px 24px;
    background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(74,222,128,0.06));
    border: 1.5px solid rgba(251,191,36,0.35);
    border-radius: 14px;
    margin-top: 10px;
    animation: riIn 0.45s ease;
    position: relative;
    overflow: hidden;
  }
  .result-inline::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(251,191,36,0.1), transparent 70%);
    pointer-events: none;
  }
  @keyframes riIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .result-inline.show { display: flex; }
  .ri-hd { font-size: 15px; color: rgba(255,255,255,0.4); margin-bottom: 3px; font-style: italic; position: relative; z-index: 1; }
  .ri-msg { font-size: 26px; font-weight: 900; color: #fbbf24; margin-bottom: 4px; line-height: 1.3; text-align: center; position: relative; z-index: 1; }
  .ri-expl { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.5; margin-bottom: 10px; max-width: 500px; margin-left: auto; margin-right: auto; font-style: italic; text-align: center; position: relative; z-index: 1; }
  .ri-row { display: flex; gap: 14px; justify-content: center; position: relative; z-index: 1; }
  .ri-vi { padding: 10px 22px; border-radius: 12px; text-align: center; min-width: 100px; }
  .ri-gold { background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); }
  .ri-silver { background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.35); }
  .ri-red { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); }
  .ri-name { font-size: 14px; margin-bottom: 3px; }
  .ri-gold .ri-name { color: #fbbf24; }
  .ri-silver .ri-name { color: #94a3b8; }
  .ri-red .ri-name { color: #f87171; }
  .ri-count { font-size: 32px; font-weight: 900; }
  .ri-gold .ri-count { color: #fbbf24; }
  .ri-silver .ri-count { color: #94a3b8; }
  .ri-red .ri-count { color: #f87171; }
  .ri-tag { font-size: 12px; margin-top: 2px; font-weight: 700; }
  .ri-tag.win { color: #4ade80; }
  .ri-tag.lose { color: #f87171; }
  .ri-wait { font-size: 14px; color: rgba(255,255,255,0.3); margin-top: 6px; font-style: italic; position: relative; z-index: 1; }

  /* 全体胜利 */
  .all-win-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(34,197,94,0.3) 0%, rgba(10,14,26,0.95) 70%);
  }
  .all-win-overlay.hidden { display: none; }
  .all-win-card { text-align: center; animation: allWin 1s ease; }
  @keyframes allWin { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
  .all-win-emoji { font-size: 110px; animation: bounce 0.8s infinite alternate; display: block; }
  .all-win-title {
    font-size: 64px; font-weight: 900;
    background: linear-gradient(135deg, #4ade80, #22d3ee, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin: 20px 0; letter-spacing: 5px;
  }
  .all-win-sub { font-size: 20px; color: rgba(255,255,255,0.6); }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-15px)} }

  /* 游戏结束 */
  .gameover-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,14,26,0.95);
  }
  .gameover-overlay.hidden { display: none; }
  .gameover-card { text-align: center; padding: 40px; max-width: 800px; width: 90%; }
  .gameover-title { font-size: 54px; font-weight: 900; color: #fbbf24; margin-bottom: 24px; letter-spacing: 5px; }
  .final-lb { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .final-lb::-webkit-scrollbar { width: 4px; }
  .final-lb::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .final-lb-item {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 22px; border-radius: 13px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    font-size: 18px;
  }
  .final-lb-item.gold-bg { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.35); }
  .final-lb-item.silver-bg { background: rgba(148,163,184,0.08); border-color: rgba(148,163,184,0.25); }
  .final-lb-item.bronze-bg { background: rgba(234,179,8,0.07); border-color: rgba(234,179,8,0.2); }
  .final-rank { font-size: 24px; width: 34px; }
  .final-name { flex: 1; text-align: left; }
  .final-score { color: #4ade80; font-weight: 700; font-size: 20px; }

  .status-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 6px 0; font-size: 14px;
    color: rgba(255,255,255,0.22); letter-spacing: 1px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: sparkle 2s infinite; }
  @keyframes sparkle { 0%,100%{opacity:.3} 50%{opacity:1} }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">
  <!-- 顶部 -->
  <div class="header">
    <div class="title-area">
      <div>
        <div class="game-title">🌿 伊甸园</div>
        <div class="game-subtitle">EDEN · TEAM GAME</div>
      </div>
    </div>
    <div style="text-align:center">
      <div id="roundBadge" class="round-badge" style="display:none">第 <span id="roundNum">1</span> 轮 / <span id="totalRoundsNum">8</span></div>
      <div id="finalRoundBadge" class="final-round-badge">🏁 最终轮</div>
      <div class="round-dots" id="roundDots"></div>
    </div>
    <div class="player-count">
      在线玩家<br><span id="playerCount">0</span> 人
      <div class="active-count" id="activeCountDisplay" style="display:none">有效: <span id="activeCountNum">0</span></div>
      <div class="eliminated-count" id="eliminatedDisplay" style="display:none">淘汰: <span id="eliminatedNum">0</span></div>
    </div>
  </div>

  <!-- 等待界面 -->
  <div id="waitingSection" class="waiting-section">
    <div class="qr-area">
      <img id="qrImg" class="qr-img" src="" alt="二维码加载中...">
      <div class="qr-label">手机扫码加入游戏</div>
      <div class="qr-url" id="qrUrl">加载中...</div>
    </div>
    <div class="waiting-info">
      <div class="waiting-big" id="waitCount">0</div>
      <div class="waiting-label">位勇士已就绪</div>
      <div style="margin-top:24px;font-size:16px;color:rgba(255,255,255,0.25)">等待主持人开始游戏</div>
    </div>
  </div>

  <!-- 游戏中：排行榜为主 -->
  <div id="gameSection" class="main-content" style="display:none">
    <div class="lb-header">
      <div class="lb-title">🏆 积分排行 <span>TOP 20</span></div>
    </div>
    <div class="lb-grid" id="lbGrid"></div>
    <div class="vote-status-bar" id="voteStatusBar">
      <div class="vsb-label">投票进度</div>
      <div class="vsb-progress"><div class="vsb-fill" id="vsbFill" style="width:0%"></div></div>
      <div class="vsb-count"><span id="vsbVoted">0</span>/<span id="vsbTotal">0</span></div>
    </div>
    <!-- ★ 内嵌结算区（排行榜下方） -->
    <div class="result-inline" id="resultInline">
      <div class="ri-hd">第 <span id="resultRound">1</span> 轮结算</div>
      <div class="ri-msg" id="resultMessage"></div>
      <div class="ri-expl" id="resultExplain"></div>
      <div class="ri-row">
        <div class="ri-vi ri-gold">
          <div class="ri-name">🍎 金苹果</div>
          <div class="ri-count" id="resultGold">0</div>
          <div class="ri-tag" id="resultGoldTag"></div>
        </div>
        <div class="ri-vi ri-silver">
          <div class="ri-name">🍎 银苹果</div>
          <div class="ri-count" id="resultSilver">0</div>
          <div class="ri-tag" id="resultSilverTag"></div>
        </div>
        <div class="ri-vi ri-red">
          <div class="ri-name">🍎 红苹果</div>
          <div class="ri-count" id="resultRed">0</div>
          <div class="ri-tag" id="resultRedTag"></div>
        </div>
      </div>
      <div class="ri-wait">等待下一轮...</div>
    </div>
  </div>

  <div class="status-bar"><div class="status-dot"></div>实时数据同步中</div>
</div>

<!-- 结果已改为内嵌到排行榜下方（resultInline），不再使用覆盖层 -->

<!-- 全体胜利特效 -->
<div id="allWinOverlay" class="all-win-overlay hidden">
  <div class="all-win-card">
    <span class="all-win-emoji">🎉</span>
    <div class="all-win-title">全体胜利！</div>
    <div class="all-win-sub">所有勇士共同守护了伊甸园<br>恭喜大家！</div>
  </div>
</div>

<!-- 游戏结束 -->
<div id="gameoverOverlay" class="gameover-overlay hidden">
  <div class="gameover-card">
    <div class="gameover-title">🏆 游戏结束</div>
    <ul class="final-lb" id="finalLb"></ul>
  </div>
</div>

<script>
const socket = io();

socket.emit('joinDisplay');

// 加载二维码
fetch('/qrcode').then(r=>r.json()).then(data => {
  if (data.qr) document.getElementById('qrImg').src = data.qr;
  document.getElementById('qrUrl').textContent = data.url;
});

// ===== 高级粒子系统 =====
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const layers = [
    Array.from({length:40}, () => ({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1+0.3,
      dx:(Math.random()-0.5)*0.15, dy:-Math.random()*0.2-0.05,
      alpha:Math.random()*0.3+0.05,
      color:['#fbbf24','#94a3b8','#f87171','#4ade80'][Math.floor(Math.random()*4)],
      pulse:Math.random()*Math.PI*2, pulseSpeed:0.01+Math.random()*0.02
    })),
    Array.from({length:25}, () => ({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.5+0.5,
      dx:(Math.random()-0.5)*0.3, dy:-Math.random()*0.35-0.1,
      alpha:Math.random()*0.4+0.1,
      color:['#fbbf24','#94a3b8','#f87171','#4ade80','#c084fc'][Math.floor(Math.random()*5)],
      pulse:Math.random()*Math.PI*2, pulseSpeed:0.015+Math.random()*0.025
    })),
    Array.from({length:10}, () => ({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*2.5+1,
      dx:(Math.random()-0.5)*0.5, dy:-Math.random()*0.5-0.15,
      alpha:Math.random()*0.2+0.05,
      color:['#fbbf24','#4ade80','#c084fc'][Math.floor(Math.random()*3)],
      pulse:Math.random()*Math.PI*2, pulseSpeed:0.02+Math.random()*0.03
    }))
  ];

  const LINE_DIST = 120;

  function draw() {
    ctx.clearRect(0,0,w,h);
    const allPs = layers.flat();

    // 连线
    ctx.lineWidth = 0.5;
    for (let i = 0; i < layers[1].length; i++) {
      for (let j = i+1; j < layers[1].length; j++) {
        const a = layers[1][i], b = layers[1][j];
        const dx = a.x - b.x, dy = a.y - b.y;
        if (Math.sqrt(dx*dx+dy*dy) < LINE_DIST) {
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.strokeStyle = `rgba(255,255,255,${(1-Math.sqrt(dx*dx+dy*dy)/LINE_DIST)*0.08})`;
          ctx.stroke();
        }
      }
    }

    layers.forEach(layer => {
      layer.forEach(p => {
        p.pulse += p.pulseSpeed;
        const pa = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));

        const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
        grad.addColorStop(0, p.color); grad.addColorStop(1, 'transparent');
        ctx.globalAlpha = pa * 0.3;
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2); ctx.fill();

        ctx.globalAlpha = pa;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();

        p.x += p.dx; p.y += p.dy;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
      });
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

function buildRoundDots(currentRound, total) {
  const dots = document.getElementById('roundDots');
  if (!dots) return;
  dots.innerHTML = '';
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.className = 'round-dot';
    if (i === total) d.classList.add('final');
    if (i < currentRound) d.classList.add('done');
    else if (i === currentRound) d.classList.add('current');
    dots.appendChild(d);
  }
}

function showRoundBadge(round, total, isFinal) {
  document.getElementById('roundBadge').style.display = isFinal ? 'none' : 'block';
  document.getElementById('finalRoundBadge').style.display = isFinal ? 'block' : 'none';
  document.getElementById('roundNum').textContent = round;
  document.getElementById('totalRoundsNum').textContent = total;
  buildRoundDots(round, total);
}

function getExplain(winners, losers) {
  if (winners.includes('red') && losers.includes('gold') && losers.includes('silver'))
    return '红苹果票数最少，少数派获胜！红色阵营+1000，金银阵营各-2000。';
  if (winners.includes('gold') && winners.includes('silver') && losers.includes('red'))
    return '金或银苹果中有一方票数少于红苹果，金银阵营整体获胜！金银各+1000，红苹果-2000。';
  if (winners.includes('gold') && losers.includes('silver') && !winners.includes('red') && !losers.includes('red'))
    return '金苹果票数最少，少数派获胜！金苹果+1000，银苹果-2000。';
  if (winners.includes('silver') && losers.includes('gold') && !winners.includes('red') && !losers.includes('red'))
    return '银苹果票数最少，少数派获胜！银苹果+1000，金苹果-2000。';
  if (winners.includes('gold') && losers.includes('red') && losers.includes('silver'))
    return '金苹果票数最少，少数派获胜！金苹果+1000，红/银各-2000。';
  if (winners.includes('silver') && losers.includes('red') && losers.includes('gold'))
    return '银苹果票数最少，少数派获胜！银苹果+1000，红/金各-2000。';
  if (winners.length === 0)
    return '票数相同，平局！所有参与者各扣2000积分。';
  return '';
}

// ===== 排行榜渲染 =====
function updateLeaderboard(lb) {
  const grid = document.getElementById('lbGrid');
  if (!grid) return;
  grid.innerHTML = '';
  lb.slice(0,20).forEach((p,i) => {
    const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
    const elimClass = p.eliminated ? 'eliminated' : '';
    const numTag = p.num ? `#${p.num}` : '';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    grid.innerHTML += `<div class="lb-item ${cls} ${elimClass}">
      <div class="lb-rank">${medal}</div>
      <div class="lb-num">${numTag}</div>
      <div class="lb-name">${p.name}</div>
      <div class="lb-score">${p.score.toLocaleString()}</div>
    </div>`;
  });
}

function updatePlayerCounts(playerCount, activeCount) {
  document.getElementById('playerCount').textContent = playerCount || 0;
  if (activeCount !== undefined && playerCount > activeCount) {
    document.getElementById('activeCountNum').textContent = activeCount;
    document.getElementById('activeCountDisplay').style.display = 'block';
    document.getElementById('eliminatedNum').textContent = playerCount - activeCount;
    document.getElementById('eliminatedDisplay').style.display = 'block';
  } else {
    document.getElementById('activeCountDisplay').style.display = 'none';
    document.getElementById('eliminatedDisplay').style.display = 'none';
  }
}

// 更新投票进度条
function updateVoteProgress(votedCount, totalCount) {
  const bar = document.getElementById('voteStatusBar');
  bar.style.display = 'flex';
  const pct = totalCount > 0 ? (votedCount / totalCount * 100) : 0;
  document.getElementById('vsbFill').style.width = pct + '%';
  document.getElementById('vsbVoted').textContent = votedCount || 0;
  document.getElementById('vsbTotal').textContent = totalCount || 0;
}

// ===== Socket事件 =====
socket.on('gameStateSync', (state) => {
  const pc = state.playerCount || 0;
  const ac = state.activePlayerCount !== undefined ? state.activePlayerCount : pc;
  updatePlayerCounts(pc, ac);
  document.getElementById('waitCount').textContent = pc;

  if (state.status === 'waiting') {
    document.getElementById('waitingSection').style.display = 'flex';
    document.getElementById('gameSection').style.display = 'none';
    document.getElementById('voteStatusBar').style.display = 'none';
  } else if (state.status === 'voting' || state.status === 'result') {
    document.getElementById('waitingSection').style.display = 'none';
    document.getElementById('gameSection').style.display = 'flex';
    showRoundBadge(state.round, state.totalRounds || 8, state.isFinalRound);
    if (state.status === 'voting') {
      updateVoteProgress(state.votedCount || 0, state.totalCount || state.activePlayerCount || 0);
    }
    updateLeaderboard(state.leaderboard);
  } else if (state.status === 'gameover') {
    showGameover(state.leaderboard);
  }
});

socket.on('playerListUpdate', (data) => {
  updatePlayerCounts(data.count, data.count);
  document.getElementById('waitCount').textContent = data.count;
  updateLeaderboard(data.players);
});

socket.on('gameStart', (data) => {
  document.getElementById('waitingSection').style.display = 'none';
  document.getElementById('gameSection').style.display = 'flex';
  // ★ 清除内嵌结算区
  document.getElementById('resultInline').classList.remove('show');
  showRoundBadge(data.round, data.totalRounds || 8, data.isFinalRound);
  updateVoteProgress(0, data.activePlayerCount || 0);
  updateLeaderboard([]);
});

socket.on('nextRound', (data) => {
  // ★ 隐藏内嵌结算区
  document.getElementById('resultInline').classList.remove('show');
  showRoundBadge(data.round, data.totalRounds || 8, data.isFinalRound);
  updateVoteProgress(0, 0);
});

socket.on('timerUpdate', (data) => {});

socket.on('voteUpdate', (data) => {
  if (data.votedCount !== undefined) {
    updateVoteProgress(data.votedCount, data.totalCount);
  }
});

socket.on('roundEnd', (data) => {
  const { result, leaderboard, round } = data;
  updateLeaderboard(leaderboard);

  if (data.activePlayerCount !== undefined) {
    updatePlayerCounts(
      Object.keys(gameState?.players || {}).length || leaderboard.length,
      data.activePlayerCount
    );
  }

  // ★ 隐藏投票进度条
  document.getElementById('voteStatusBar').style.display = 'none';

  if (result.specialEvent === 'all_red') {
    document.getElementById('allWinOverlay').classList.remove('hidden');
    document.getElementById('resultInline').classList.remove('show');
    return;
  }

  // ★ 显示内嵌结算区（不是覆盖层）
  const ri = document.getElementById('resultInline');
  ri.classList.add('show');
  document.getElementById('allWinOverlay').classList.add('hidden');

  document.getElementById('resultRound').textContent = round + (data.isFinalRound ? '（最终轮）' : '');
  document.getElementById('resultMessage').textContent = result.message;

  const winners = result.winners || [];
  const losers = result.losers || [];
  document.getElementById('resultGold').textContent = result.votes.gold;
  document.getElementById('resultGoldTag').textContent = winners.includes('gold') ? '✅ 胜' : losers.includes('gold') ? '❌ 败' : '';
  document.getElementById('resultGoldTag').className = 'ri-tag ' + (winners.includes('gold') ? 'win' : losers.includes('gold') ? 'lose' : '');
  document.getElementById('resultSilver').textContent = result.votes.silver;
  document.getElementById('resultSilverTag').textContent = winners.includes('silver') ? '✅ 胜' : losers.includes('silver') ? '❌ 败' : '';
  document.getElementById('resultSilverTag').className = 'ri-tag ' + (winners.includes('silver') ? 'win' : losers.includes('silver') ? 'lose' : '');
  document.getElementById('resultRed').textContent = result.votes.red;
  document.getElementById('resultRedTag').textContent = winners.includes('red') ? '✅ 胜' : losers.includes('red') ? '❌ 败' : '';
  document.getElementById('resultRedTag').className = 'ri-tag ' + (winners.includes('red') ? 'win' : losers.includes('red') ? 'lose' : '');

  document.getElementById('resultExplain').textContent = getExplain(winners, losers);
});

socket.on('gameOver', (data) => { showGameover(data.leaderboard); });

function showGameover(lb) {
  document.getElementById('gameoverOverlay').classList.remove('hidden');
  const medals = ['🥇','🥈','🥉'];
  const bgCls = ['gold-bg','silver-bg','bronze-bg'];
  document.getElementById('finalLb').innerHTML = lb.slice(0,20).map((p,i) => {
    const numTag = p.num ? `#${p.num} ` : '';
    const elimStyle = p.eliminated ? 'style="opacity:0.35;text-decoration:line-through"' : '';
    return `<li class="final-lb-item ${bgCls[i]||''}" ${elimStyle}>
      <span class="final-rank">${medals[i]||i+1}</span>
      <span class="final-name">${numTag}${p.name}</span>
      <span class="final-score">${p.score.toLocaleString()} 分</span>
    </li>`;
  }).join('');
}

socket.on('gameReset', () => { location.reload(); });
</script>
